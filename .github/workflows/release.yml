# Signed desktop release bundles (m0-s16 slice).
#
# Deliberately not part of `ci`: packaging costs minutes that the 10-minute CI
# critical-path budget should spend on correctness. The signing *logic* is
# proven on every push by `release-signing-check`, which runs the same two
# scripts against a seeded tampered bundle with an ephemeral key. This workflow
# is where the real key is used, and it runs only on a signed release tag.
#
# Repository configuration required:
#   secrets.PROJECTOS_RELEASE_SSH_KEY  the private half of the release signing key
#   vars.PROJECTOS_RELEASE_SIGNERS     the matching OpenSSH allowed_signers lines
#   vars.PROJECTOS_RELEASE_IDENTITY    the principal used in allowed_signers
name: release

on:
  push:
    tags: ["core-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: macos-aarch64
          - runner: ubuntu-latest
            platform: linux-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: rustup show
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: "1.47.1"
      - name: pnpm via corepack
        run: corepack enable pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Tauri Linux system dependencies
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install the release signing key
        env:
          RELEASE_SSH_KEY: ${{ secrets.PROJECTOS_RELEASE_SSH_KEY }}
          RELEASE_SIGNERS: ${{ vars.PROJECTOS_RELEASE_SIGNERS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_SSH_KEY" || -z "$RELEASE_SIGNERS" ]]; then
            echo "::error::The release signing key or its allowed_signers lines are not configured." >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$RELEASE_SSH_KEY" > "$RUNNER_TEMP/release_key"
          printf '%s\n' "$RELEASE_SIGNERS" > "$RUNNER_TEMP/allowed_signers"
      - name: Build and sign the bundles
        run: just package "$RUNNER_TEMP/release_key"
      - name: Verify what we just signed
        env:
          RELEASE_IDENTITY: ${{ vars.PROJECTOS_RELEASE_IDENTITY }}
        run: just verify-package "$RELEASE_IDENTITY" "$RUNNER_TEMP/allowed_signers"
      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release_key"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: projectos-${{ matrix.platform }}
          path: |
            target/release/bundle/**
          if-no-files-found: error
