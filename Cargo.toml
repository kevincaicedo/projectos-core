# ProjectOS core workspace — master plan §19 layout.
# This directory is structured exactly as the future public `projectos-core`
# repository; m0-s17 extracts it into its own repo + submodule.

[workspace]
resolver = "2"
members = [
    "crates/pos-foundation",
    "crates/pos-store",
    "crates/pos-log",
    "crates/pos-domain",
    "crates/pos-capabilities",
    "crates/pos-gateway",
    "crates/pos-ingest",
    "crates/pos-connect",
    "crates/pos-knowledge",
    "crates/pos-agents",
    "crates/pos-planning",
    "crates/pos-exec",
    "crates/pos-sched",
    "crates/pos-api",
    "crates/pos-sync",
    "crates/pos-plugins",
    "crates/pos-sdk",
    "bins/pos-server",
    "bins/pos",
    "bins/pos-bench",
    "bins/check-dep-dag",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# Every entry here needs a DEPENDENCIES.md row (justification + owner + eject path).
# The §20 auth decision: own argon2id + sessions, no auth SaaS (m0-s08).
argon2 = { version = "0.5", features = ["std"] }
# axum/tokio arrive with the m0-s06 HTTP+SSE transport (master plan §20 rows);
# default-features off so the transport carries only the routing surface it
# dispatches — the feature list is part of the reviewed supply chain.
axum = { version = "0.8", default-features = false, features = ["http1", "query", "tokio"] }
blake3 = "1"
# OS-entropy session tokens for the server shell (m0-s08); the one blessed
# randomness source outside test seeds.
getrandom = "0.3"
ciborium = "0.2"
# Civil-time arithmetic over IANA zones with explicit gap/ambiguity handling
# (m0-s14 cron). Default features use the OS tz database on Unix and the
# bundled one on Windows, so a zone rule change ships with the OS, not with us.
jiff = "0.2"
clap = { version = "4", features = ["derive"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
proptest = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned exactly: the vec0 module is storage-format-bearing, so upgrades are
# deliberate. 0.1.9 is the newest stable; the 0.1.10 alphas ship a broken
# C-source packaging (missing sqlite-vec-diskann.c) as of 2026-08.
sqlite-vec = "=0.1.9"
# The local embedding runtime (m1-s04, ADR-0009). Default features off: we
# take the inference session, the build-time binary fetch, and nothing else —
# no `ndarray` (our tensors are flat `Vec<f32>` and stay that way) and no
# `tracing` (m0-s15 pins emission to one module of ours). Pinned exactly: this
# is a pre-1.0 release candidate whose API moves between them, and the eject
# path in DEPENDENCIES.md depends on the surface being the one we reviewed.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native", "api-27"] }
syn = { version = "3", features = ["full", "visit"] }
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-build = "=2.6.3"
# Desktop lifecycle plugins (m0-s07). Pinned exactly like the Tauri core they
# version with.
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-single-instance = "=2.4.3"
tempfile = "3"
# tokio is the §20 async-runtime decision; features stay minimal per consumer.
tokio = { version = "1", default-features = false }
# Bounded adapter from Tokio channels to HTTP response streams; transport only.
tokio-stream = { version = "0.1", default-features = false }
# The §20 observability facade (m0-s15). Emission only: pos-foundation's
# telemetry module is the single call site, and `attributes` stays off because
# `#[instrument]` would pull syn/quote for sugar the typed facade replaces.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# ts-rs generates the apps/ui API types from the Rust wire types (L12); the
# serde-compat default keeps the emitted TS aligned with the serde wire names.
ts-rs = "12"
# Unicode canonical decomposition for the WordPiece normalizer (m1-s04). From
# the `unicode-rs` maintainers; three crates against `tokenizers`' twenty-nine.
# We own the tokenization algorithm — this supplies the standard's own NFD
# table, which is exactly the thing nobody should hand-maintain.
unicode-normalization = "0.1"

# The reviewed TLS transport (m1-s03, ADR-0006 §1). Default features off: we
# take `rustls` (which brings the ring provider and the webpki root store) and
# nothing else — no gzip, no cookies, no proxy support. The feature list is
# part of the reviewed supply chain.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
# Audio demuxing and decoding (ADR-0006 §3). Codecs are enumerated rather than
# `all`: every one is attack surface over untrusted bytes (L6), so the list is
# exactly the containers a design partner drops — m4a/mp4, mp3, wav, flac,
# ogg, and mkv/webm screen recordings.
symphonia = { version = "0.6", default-features = false, features = ["aac", "alac", "isomp4", "mp3", "wav", "pcm", "flac", "ogg", "vorbis", "mkv"] }
# Pinned exactly, and that pin is load-bearing: this crate builds whisper.cpp,
# whose ABI changes between versions, and ADR-0006 §2 took it as stated debt in
# place of vendoring the FFI leaf. No GPU feature is enabled — the §18 gate is
# stated for CPU on the reference laptop.
whisper-rs = "=0.16.0"

[workspace.lints.rust]
# -D warnings everywhere (STYLE "Tooling as law"); never weaken to merge.
warnings = "deny"
# Forbid unsafe outside the audited FFI leaf modules; those crates opt out
# explicitly with their own [lints] table + SAFETY.md (STYLE unsafe policy).
unsafe_code = "forbid"

[workspace.lints.clippy]
# Curated set, not the whole pedantic group: with `warnings = deny` above, every
# warn-level lint is a CI failure, so each entry here is a deliberate rule.
# Curation evolves via m0-s02 review; never weaken to merge (STYLE).
dbg_macro = "deny"
todo = "deny"
# Sized-integer discipline at boundaries (STYLE "explicitly sized integers"):
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
# Honest errors (STYLE panic policy — the m0-s02 grep is the primary enforcement):
fallible_impl_from = "warn"
# Control-flow hygiene (STYLE "push ifs up, fors down"):
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
