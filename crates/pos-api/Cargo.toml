[package]
name = "pos-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# The axum HTTP+SSE transport (m0-s06). A feature rather than a default so the
# desktop shell, which dispatches over Tauri IPC, does not link a web server.
# This is transport selection, not a capability switch — no cfg(cloud) shape.
http = ["dep:axum", "dep:tokio"]

[dependencies]
pos-foundation = { path = "../pos-foundation" }
pos-store = { path = "../pos-store" }
pos-log = { path = "../pos-log" }
pos-domain = { path = "../pos-domain" }
pos-capabilities = { path = "../pos-capabilities" }
# Typed inputs/outputs for the m0-s05 project operations; ts-rs generates the
# apps/ui types from these same structs (m0-s06).
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "net"] }
pos-gateway = { path = "../pos-gateway" }
pos-ingest = { path = "../pos-ingest" }
pos-connect = { path = "../pos-connect" }
pos-knowledge = { path = "../pos-knowledge" }
pos-agents = { path = "../pos-agents" }
pos-planning = { path = "../pos-planning" }
pos-exec = { path = "../pos-exec" }
pos-sched = { path = "../pos-sched" }
# Full dependency (not dev-only): the ts-rs staleness check generates into an
# isolated scratch tree at check time.
tempfile = { workspace = true }
