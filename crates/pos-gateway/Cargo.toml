[package]
name = "pos-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
pos-foundation = { path = "../pos-foundation" }
# Provider wire bodies (request JSON, SSE payloads) and the model manifest
# are JSON; the prompt/eval shapes are serde types (m0-s10/m0-s11).
serde = { workspace = true }
serde_json = { workspace = true }
# BLAKE3 pins prompts (prompts.lock) and verifies model artifacts — the same
# hash the CAS already standardizes on (m0-s11).
blake3 = { workspace = true }
ureq = { workspace = true }
whisper-rs = { workspace = true }
# The local embedding runtime, confined to one adapter module by the
# `vendor-containment` check-discipline rule (m1-s04, ADR-0009).
ort = { workspace = true }
# NFD for the WordPiece normalizer; see `wordpiece.rs` for why the algorithm
# is ours and only the Unicode table is not.
unicode-normalization = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
